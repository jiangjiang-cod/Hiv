<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mother-to-Child Prevention Machine</title>
<script>'use strict';

const NIH = 'https://clinicalinfo.hiv.gov/en/guidelines/perinatal/';
const EVIDENCE = Object.freeze({
  birth: ['NIH · Intrapartum HIV care', NIH + 'intrapartum-care'],
  infant: ['NIH · Infant antiretroviral care', NIH + 'management-infants-utero-intrapartum-breastfeeding-hiv-exposure'],
  feeding: ['NIH · Infant feeding', NIH + 'preventing-transmission-infant-feeding']
});
const LIMITS = Object.freeze({ birthRisk: 1, suppression: 50 });
const TAKEAWAY = 'HIV care before and during birth helps protect babies, and a separate feeding plan supports them after birth.';
const clips = Object.freeze([[.9,6.1],[6.8,15.0],[15.7,22.0],[22.7,30.4],[31.1,36]].map(Object.freeze));
const scenes = Object.freeze([
  {button:'Trace pregnancy',title:'During pregnancy',stage:'Pregnancy',track:0, suppression:0,
   route:'Placental route', why:'HIV can pass during pregnancy. The cutaway shows a possible route through the placenta. A moving symbol marks possible exposure.',
   care:'Prenatal HIV testing can connect a parent to treatment and viral load monitoring.', source:'birth'},
  {button:'Start treatment',title:'Treatment during pregnancy',stage:'Pregnancy',track:0,suppression:1,
   route:'ART lowers viral load', why:'Antiretroviral therapy (ART) suppresses HIV replication. The slowing wheel is a symbol for reduced replication over time.',
   care:'Continue prescribed ART and monitor viral load with the care team. A low viral load must be documented near birth to apply the displayed estimate.', source:'birth'},
  {button:'Prepare for birth',title:'During labor and birth',stage:'Birth',track:1,suppression:1,
   route:'Blood or fluids during birth', why:'Exposure can happen during birth through contact with blood or other fluids. Birth care is planned around HIV RNA and other clinical factors.',
   care:'Infants with HIV exposure receive antiretroviral medicine chosen for their circumstances and follow-up HIV testing.', source:'infant'},
  {button:'Plan infant feeding',title:'After birth',stage:'Feeding',track:2,suppression:1,
   route:'Breast milk route', why:'HIV can pass through breast milk. With consistent ART and sustained viral suppression during pregnancy and postpartum, breastfeeding risk is very low and some risk remains.',
   care:'Discuss feeding options and monitoring together. Properly prepared formula or pasteurized donor milk from a milk bank removes transmission risk through breastfeeding.', source:'feeding'},
  {button:'Reset the model',title:'Return to the start',stage:'Reset',track:0,suppression:0,
   route:'Selector returning', why:'The carriage returns to its cradle. The three stages use different kinds of care.',
   care:'A parent and their care team can make a plan for pregnancy, birth and feeding.', source:'birth'}
].map(Object.freeze));
const idle = Object.freeze({title:'Before starting',stage:'Ready',track:0,suppression:0,
  route:'No route selected',why:'Follow the carriage through pregnancy, birth and infant feeding.',
  care:'Each window represents a possible exposure route, and the treatment dial represents reduced viral replication.',source:'birth'});
const clamp=(n,min=0,max=1)=>Math.max(min,Math.min(max,n));
const ease=n=>{ n=clamp(n); return n*n*(3-2*n); };
const mix=(a,b,p)=>a+(b-a)*p;
function estimate({stage,onArt,hivRNA,documentedNearBirth}) {
  return (stage==='Pregnancy'||stage==='Birth') && onArt && documentedNearBirth &&
    Number.isFinite(hivRNA) && hivRNA>=0 && hivRNA<LIMITS.suppression ? LIMITS.birthRisk : null;
}
function modelAtTime(seconds) {
  const t=clamp(Number.isFinite(seconds)?seconds:0,0,36);
  const index=clips.findLastIndex(([start])=>t>=start);
  const [start,end]=clips[index]||[0,.9];
  const d=t-start, p=clamp(d/(end-start));
  const next=scenes[index]||idle;
  const previous=scenes[index-1]||idle;
  const settled=t>=35.1;
  const scene=settled?idle:next;
  const carriage=mix(previous.track,next.track,ease(d/2.7));
  const suppression=mix(previous.suppression,next.suppression,ease((d-(index===1?.9:0))/4));
  const treated=(index===1 && d>=4.9)||index===2;
  const value=estimate({stage:scene.stage,onArt:treated,hivRNA:treated?LIMITS.suppression-1:null,documentedNearBirth:treated});
  const showFlow=index>=0&&index<=3;
  const alpha=(showFlow?1:0)*ease((d-.25)/1.3)*(1-ease((d-(end-start-1.05))/.95));
  const phases=[0,6.8,15.7,22.7,31.1];
  const artTravel=clamp(t-phases[1]-.9,0,4);
  const rawAngle=clamp(t-.9,0,36)*67-53*(artTravel**2/8+Math.max(0,t-phases[1]-4.9));
  const resetAngle=(phases[4]-.9)*67-53*(2+phases[4]-phases[1]-4.9);
  const wheelAngle=index===4?mix(resetAngle,Math.ceil(resetAngle/360)*360,ease(d/4)):rawAngle;
  return { t,index,p,scene,carriage,suppression,alpha,flowTrack:next.track,wheelAngle,
    expected: value==null?'—':'≤'+value+'%',
    threshold: '<'+LIMITS.suppression+' copies/mL',
    estimateLabel: value==null?(index===3?'Separate feeding guidance':'Pregnancy and birth reference'):'Pregnancy and birth only',
    estimateActive:value!==null, treatmentStatus:suppression>.998?'ART model · suppressed':suppression>.02?'ART model · changing':'ART model · standby',
    source:EVIDENCE[scene.source], takeAway:TAKEAWAY, end:settled,
    available:index<0||settled?0:(t>=end?index+1:-1)};
}
if(typeof module!=='undefined') module.exports={modelAtTime,estimate,clips,scenes,LIMITS};
</script>
<style>
:root{color-scheme:light;--cream:#f5f0e5;--ink:#202d3e;--shadow:#ddd4c3;--sage:#b8c9aa;--coral:#ce7866;--brass:#e9b868}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:system-ui,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1480px;margin:auto;padding:42px 36px 28px}header{border-top:1.2px solid var(--ink);border-bottom:1.2px solid var(--ink);padding:15px 0 17px;margin-bottom:25px}h1,h2,.idea{font-family:Georgia,serif;line-height:1.09}h1{font-size:clamp(2.1rem,5vw,4.25rem);letter-spacing:-.052em;margin:.1em 0}.kicker{font-size:.69rem;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.subtitle{margin:6px 0 0}
.stage{display:grid;grid-template-columns:194px minmax(0,1fr) 266px;gap:18px;align-items:start}.switches{position:relative}.switches ol{margin:8px 0 12px;padding:0;list-style:none}.switches li{margin:0 0 9px}
button{border:1.2px solid var(--ink);border-radius:7px;box-shadow:3px 3px var(--shadow);font:650 .86rem/1.15 system-ui;color:var(--ink);cursor:pointer}
.step{width:100%;min-height:43px;background:#ede5d5;display:flex;align-items:center;gap:8px;text-align:left;padding:5px 9px}
.step:disabled{cursor:default;color:#55524a}.step[data-done=true]{background:#dce4d0}.step[data-active=true],.step:not(:disabled){background:var(--brass);color:var(--ink)}.step[data-active=true]{box-shadow:1px 1px var(--shadow)}
.step span{font:700 .75rem system-ui;border:1.2px solid currentColor;border-radius:50%;width:23px;height:23px;flex:none;display:grid;place-items:center}
#play{padding:8px 12px;background:#f8e6b8}button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#pointer{position:absolute;width:35px;height:42px;left:0;top:0;pointer-events:none;z-index:1}.render #play,#pointer[hidden]{display:none}
figure{margin:0;min-width:0;background:#f8f3e8;border:1.2px solid #c9bfa9;border-radius:10px;padding:12px 10px 10px}.machine{width:100%;height:auto;display:block;overflow:hidden}.machine text{stroke:none;fill:var(--ink);font-weight:700;letter-spacing:.045em}
figcaption{border-top:1.2px solid #dbd0bc;padding:7px 6px 1px;font-size:.76rem}.key{display:inline-block;border:1.2px solid var(--ink);width:9px;height:9px;border-radius:50%;margin-right:4px}.key.coral{background:var(--coral)}.key.sage{background:var(--sage);margin-left:11px}
.notes{background:#fffaef;border:1.2px solid var(--ink);border-radius:8px;box-shadow:3px 3px var(--shadow);padding:15px}.notes h2{margin:.38em 0;font-size:1.53rem}.notes p{margin:0 0 13px}.notes .claim{background:#e6ebdb;border-left:2px solid #67825d;padding:8px;font-size:.86rem}.notes a{color:inherit;font-size:.8rem;text-underline-offset:3px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.chips span{border:1.2px solid #b4a58f;background:#faf3e3;border-radius:20px;padding:3px 9px;font-size:.76rem}.idea{font-size:1.23rem;border-top:1.2px solid var(--ink);padding-top:11px;margin:0}.scope{font-size:.8rem;margin:8px 0 0}
@media(max-width:1050px){.stage{grid-template-columns:153px minmax(0,1fr) 210px;gap:12px}main{padding:23px 18px}}
@media(max-width:800px){.stage{grid-template-columns:122px minmax(0,1fr)}.notes{grid-column:2}.step{font-size:.77rem;gap:4px;padding:5px}.step span{width:19px;height:19px}.notes h2{font-size:1.25rem}}
@media(max-width:520px){main{padding:16px 12px}.stage{display:flex;flex-direction:column}.switches,figure,.notes{width:100%}.switches li{margin:0 0 5px}}
</style></head>
<body><main><header><div class="kicker">HIV education workshop · machine 06</div><h1>Mother-to-Child Prevention</h1><p class="subtitle">Follow three stages of care through a mechanical cutaway.</p></header>
<div class="stage">
<nav class="switches" aria-label="Lesson switches"><div class="kicker">Operate the machine</div><ol id="switches"></ol><button id="play" type="button">Play 36 s tour</button>
<svg id="pointer" viewBox="0 0 40 48" aria-hidden="true" hidden><path d="M7 18c3-3 6-1 9 2V6c0-5 6-5 6 0v15c2-4 6-4 7 0 3-3 6-1 7 3 4-2 6 1 5 6l-3 9-2 6H18l-3-8z" fill="#e9b868" stroke="#202d3e" stroke-width="1.2" stroke-linejoin="round"/><path d="M18 39h20m-11-16v5m7-4v4" fill="none" stroke="#202d3e" stroke-width="1.2"/></svg></nav>
<figure><svg class="machine" viewBox="0 0 910 575" role="img" aria-label="Isometric three-window teaching machine with a moving stage selector and a separate ART replication wheel"><g id="rig"></g></svg>
<figcaption><span class="key coral"></span>Possible exposure symbol <span class="key sage"></span>Care or treatment indicator</figcaption></figure>
<aside class="notes"><div class="kicker" id="stage"></div><h2 id="heading"></h2><p id="why"></p><p id="care"></p><p class="claim" id="claim" hidden></p><a id="reference" target="_blank" rel="noopener"></a><br id="extraBreak" hidden><a id="extraReference" target="_blank" rel="noopener" hidden></a></aside>
</div>
<div class="chips"><span id="route"></span><span id="treatment"></span><span id="estimate"></span></div>
<p class="idea"><strong>The big idea:</strong> <span id="idea"></span></p><p class="scope">This cutaway is a teaching model. Its symbols do not count virus particles or estimate a person’s risk.</p>
</main><script>'use strict';
const ink='#202d3e', shadow='#ddd4c3', coral='#ce7866', sage='#a9bd98';
const brass=['#f3d79a','#e5b669','#b48449'];
const chrome=['#f2eee3','#dce2d9','#a6b3ad'];
const green=['#e2e8d7','#c7d5ba','#8fa98c'];
const glass=['#e9f1e8','#dce9dd','#b0c8bc'];
const outline='stroke="'+ink+'" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"';
const at=(id)=>document.getElementById(id);
const label=(x,y,txt,size=14,align='middle')=>`<text x="${x}" y="${y}" text-anchor="${align}" font-size="${size}">${txt}</text>`;
const rect=(x,y,w,h,r,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c}" ${outline}/>`;
const line=(x,y,x2,y2)=>`<path d="M${x} ${y}L${x2} ${y2}" fill="none" ${outline}/>`;
const disk=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${outline}/>`;
const bolt=(x,y)=>disk(x,y,4,chrome[0])+line(x-2,y+1,x+2,y-1);
const box=(x,y,w,h,d,p)=>`<path d="M${x} ${y}l${d} ${-d*.57}h${w}l${-d} ${d*.57}z" fill="${p[0]}" ${outline}/><path d="M${x+w} ${y}l${d} ${-d*.57}v${h}l${-d} ${d*.57}z" fill="${p[2]}" ${outline}/>`+rect(x,y,w,h,0,p[1]);
const pipe=(d,c='#c7d9ce')=>`<path d="${d}" fill="none" stroke="${ink}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="13.6" stroke-linecap="round" stroke-linejoin="round"/>`;
const gear=(x,y,r,a)=>`<g transform="rotate(${a} ${x} ${y})">${Array.from({length:12},(_,i)=>`<g transform="rotate(${i*30} ${x} ${y})">${rect(x-3,y-r-3,6,9,1,brass[1])}</g>`).join('')}${disk(x,y,r,brass[1])}${disk(x,y,r*.69,brass[0])}${Array.from({length:5},(_,i)=>disk(x+r*.46*Math.cos(i*1.257),y+r*.46*Math.sin(i*1.257),3,chrome[2])).join('')}${bolt(x,y)}</g>`;
const positions=[218,422,626];
const stationNames=['PREGNANCY','BIRTH','FEEDING'];
const routes=['PLACENTA','BLOOD / FLUID','BREAST MILK'];
const anatomy=[
  '<path d="M0 27C5 9 23 7 38 12c10 4 15 12 26 14v20C49 42 43 30 33 31 19 32 10 46 0 48z" fill="#e7aa94" '+outline+'/>'+line(13,36,29,20)+line(29,20,51,31),
  '<path d="M0 17Q16 8 27 20T64 17v13Q46 44 32 31T0 30z" fill="#e7aa94" '+outline+'/>'+disk(47,42,8,brass[0])+disk(37,46,5,brass[0]),
  '<path d="M30 7c9 15 18 25 18 36a18 18 0 01-36 0c0-11 9-21 18-36z" fill="#f3e7c8" '+outline+'/><path d="M20 45q2 7 8 8" fill="none" '+outline+'/>'
];
const base=`
<path d="M116 515h645l78-43-22 65-625 15z" fill="${shadow}"/>
${box(137,493,65,24,26,chrome)}${box(702,493,65,24,26,chrome)}
${box(111,459,671,42,63,brass)}
${box(124,144,648,320,59,green)}
${box(150,168,584,262,24,chrome)}
${rect(169,176,551,246,7,glass[0])}
${box(166,118,207,32,28,brass)}${box(532,116,181,35,28,chrome)}
${label(269,139,'PERINATAL CARE BENCH',14)}
${label(622,139,'ART REPLICATION MODEL',12)}
${pipe('M366 115H407Q419 115 419 102V88H578Q590 88 590 101V114')}
${rect(411,94,17,20,2,chrome[2])}${rect(581,94,17,20,2,chrome[2])}
${box(432,96,111,19,18,brass)}${disk(486,74,30,chrome[2])}
${positions.map((x,i)=>`${box(x-28,208,156,164,12,chrome)}${rect(x-19,215,138,145,5,glass[1])}${label(x+50,236,stationNames[i],14)}
${rect(x+10,248,80,66,21,'#edf1dc')}<g transform="translate(${x+20} 253)">${anatomy[i]}</g>
${pipe(`M${x-8} 325h116`)}${rect(x-12,315,11,20,2,brass[1])}${rect(x+102,315,12,20,2,brass[1])}
${label(x+50,351,routes[i],10)}${bolt(x-12,221)}${bolt(x+111,221)}`).join('')}
${pipe('M197 390H687', '#b5bfb1')}
${positions.map(x=>disk(x+50,390,5,chrome[0])).join('')}
${rect(201,434,266,48,4,'#fff4dc')}${rect(484,434,239,48,4,'#e4ead8')}
${label(218,451,'PREGNANCY & BIRTH REFERENCE',10,'start')}
${label(499,451,'NEAR-BIRTH HIV RNA CRITERION',10,'start')}
${Array.from({length:9},(_,i)=>line(746,204+i*16,761,201+i*16)).join('')}
${[177,714].map(x=>[184,409].map(y=>bolt(x,y)).join('')).join('')}
${[132,764].map(x=>bolt(x,480)).join('')}
${rect(143,429,47,22,4,brass[1])}${line(151,440,182,440)}
`;
function virion(x,y,alpha) {
  const points=Array.from({length:6},(_,i)=>{
    const a=i*Math.PI/3,dx=Math.cos(a),dy=Math.sin(a);
    return line(x+3.5*dx,y+3.5*dy,x+5.3*dx,y+5.3*dy);
  }).join('');
  return `<g opacity="${alpha}">${disk(x,y,3.5,coral)}${points}</g>`;
}
function renderRig(state){
  const x=mix(positions[0],positions[2],state.carriage/2)+50;
  const flowX=positions[state.flowTrack];
  const dots=Array.from({length:4},(_,i)=>{
    const q=((state.t*.37+i*.25)%1+1)%1;
    return virion(flowX-7+q*112,325,state.alpha*(1-.58*state.suppression)*ease(q*9)*ease((1-q)*9));
  }).join('');
  const value=state.expected.replace('<','&lt;');
  const threshold=state.threshold.replace('<','&lt;');
  return base+
    gear(486,74,27,state.wheelAngle)+
    `<path d="M544 70H570V115" fill="none" ${outline}/>`+rect(548,65,15,10,2,chrome[0])+
    disk(547,105,5,state.suppression>.998?sage:brass[0])+
    dots+
    box(x-24,378,48,24,9,brass)+disk(x,390,8,state.suppression>.998?sage:chrome[0])+bolt(x-16,390)+bolt(x+16,390)+
    label(218,472,value,19,'start')+label(265,470,state.estimateLabel,10,'start')+
    label(500,472,threshold,16,'start');
}
const renderMode=new URLSearchParams(location.search).has('render');
document.body.classList.toggle('render',renderMode);
const machineTemplate=document.querySelector('.machine').cloneNode(true);
const buttons=scenes.map((scene,i)=>{
  const item=document.createElement('li'), button=document.createElement('button');
  button.type='button'; button.className='step';button.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${scene.button}`;
  item.append(button);at('switches').append(item);return button;
});
let animation=0, playback='manual', busy=false, nextButton=0, shownTime=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function placePointer(state,guided) {
  const pointer=at('pointer');
  const hidden=!guided||state.end;
  pointer.toggleAttribute('hidden',hidden);
  if(hidden){pointer.removeAttribute('style');return;}
  const targets=buttons.map(button=>button.offsetTop+button.offsetHeight/2);
  const fromIndex=Math.max(0,state.index);
  const toIndex=Math.min(buttons.length-1,fromIndex+1);
  const [start,end]=clips[fromIndex];
  const target=state.index<0?mix(targets[0]-32,targets[0],ease(state.t/.9)):
    mix(targets[fromIndex],targets[toIndex],ease((state.t-end)/.7));
  const press=state.index<0?0:Math.sin(Math.PI*clamp((state.t-start)/.28));
  pointer.style.transform=`translate(${buttons[0].offsetWidth-36-6*press}px,${target-9+4*press}px) scale(${1-.07*press})`;
}
function paint(state,guided){
  shownTime=state.t;
  if(renderMode){
    const freshMachine=machineTemplate.cloneNode(true);
    freshMachine.querySelector('#rig').innerHTML=renderRig(state);
    document.querySelector('.machine').replaceWith(freshMachine);
  }else{
    at('rig').innerHTML=renderRig(state);
  }
  at('stage').textContent=state.scene.stage;at('heading').textContent=state.scene.title;
  at('why').textContent=state.scene.why;at('care').textContent=state.scene.care;
  at('claim').hidden=!state.estimateActive;
  at('claim').textContent=state.estimateActive?
    state.expected+' risk of transmission during pregnancy and birth in the NIH guideline example, when ART is taken during pregnancy and HIV RNA '+state.threshold+' is documented near birth.':'';
  at('reference').textContent=state.source[0]+' ↗';at('reference').href=state.source[1];
  at('extraBreak').hidden=at('extraReference').hidden=!(state.estimateActive && state.scene.source!=='birth');
  at('extraReference').textContent=EVIDENCE.birth[0]+' ↗';at('extraReference').href=EVIDENCE.birth[1];
  at('route').textContent=state.scene.route;at('treatment').textContent=state.treatmentStatus;
  at('estimate').textContent=state.estimateActive?state.expected+' · pregnancy and birth':state.estimateLabel;
  at('idea').textContent=state.takeAway;
  buttons.forEach((button,i)=>{
    button.disabled=renderMode||guided||busy||i!==nextButton;
    button.dataset.active=String(i===state.index&&!state.end);
    button.dataset.done=String(i<state.index&&!state.end);
  });
  placePointer(state,guided);
  return state;
}
window.seek=t=>{
  if(animation)cancelAnimationFrame(animation);
  animation=0; playback='manual';busy=false;
  return paint(modelAtTime(t),true);
};
window.perinatalModel=Object.freeze({modelAtTime,estimate,clips,LIMITS});
function run(from,to,guided,done){
  const begin=performance.now();
  function tick(now){
    const t=Math.min(to,from+(now-begin)/1000);
    paint(modelAtTime(t),guided);
    if(t<to){animation=requestAnimationFrame(tick);return;}
    animation=0;done();
  }
  animation=requestAnimationFrame(tick);
}
if(!renderMode){
  buttons.forEach((button,i)=>button.addEventListener('click',()=>{
    if(busy||i!==nextButton)return;
    if(animation)cancelAnimationFrame(animation);
    playback='manual';busy=true;at('play').textContent='Play 36 s tour';
    const [start,end]=clips[i];
    function done(){busy=false;nextButton=i===clips.length-1?0:i+1;paint(modelAtTime(end),false);}
    if(reduced.matches)done();
    else {paint(modelAtTime(start),false);run(start,end,false,done);}
  }));
  at('play').addEventListener('click',()=>{
    if(playback==='tour'){
      cancelAnimationFrame(animation);animation=0;playback='paused';at('play').textContent='Resume tour';return;
    }
    if(animation)cancelAnimationFrame(animation);
    const from=playback==='paused'?shownTime:0;
    playback='tour';busy=true;at('play').textContent='Pause tour';
    run(from,36,true,()=>{playback='manual';busy=false;nextButton=0;at('play').textContent='Replay tour';paint(modelAtTime(36),false);});
  });
}
paint(modelAtTime(0),renderMode);
</script></body></html>
