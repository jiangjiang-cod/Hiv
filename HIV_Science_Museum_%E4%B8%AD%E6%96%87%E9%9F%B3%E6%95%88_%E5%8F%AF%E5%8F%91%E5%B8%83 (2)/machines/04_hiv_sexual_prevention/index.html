<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sexual Transmission Prevention Machine</title>
<script>
'use strict';
const evidence = Object.freeze({
  route:['CDC · How HIV Spreads','https://www.cdc.gov/hiv/causes/'],
  condom:['CDC · Condom Use','https://www.cdc.gov/condom-use/'],
  prep:['CDC · PrEP clinical guidance','https://www.cdc.gov/hivnexus/hcp/prep/'],
  mechanism:['HIV.gov · How PrEP works','https://www.hiv.gov/hiv-basics/hiv-prevention/using-hiv-medication-to-reduce-risk/pre-exposure-prophylaxis/']
});
const efficacy = Object.freeze({percent:99, qualifier:'about', measure:'relative risk reduction', route:'acquiring HIV from sex', condition:'when taken as prescribed'});
const home={title:'Two ways to protect',what:'Start the teaching pump to follow an example exposure.',why:'HIV can reach a susceptible mucous membrane in certain sexual exposures. The model assumes the fluid contains transmissible HIV.',tip:'Coral symbols show possible exposure. The machine does not show an infection outcome.',source:['route'],pump:0,shield:0,drug:0,plate:0};
const lessons = [
  {...home,title:'Trace an exposure',range:[.9,5.7],pump:1,what:'The sample pump circulates fluid toward the mucous-membrane model.',why:'During vaginal or anal sex, certain fluids containing transmissible HIV can contact a susceptible mucous membrane.',tip:'Contact can create a potential exposure. Infection is not inevitable.'},
  {...home,title:'Slide the condom barrier',range:[6.4,13.1],pump:1,shield:1,what:'The slider seats a protective membrane between the fluid and the contact surface.',why:'A condom is a physical barrier. Used correctly and consistently, it reduces the chance that fluids carrying HIV reach a susceptible surface.',tip:'The seal is an illustration of correct use. It represents neither perfect real-world protection nor a personal estimate.',source:['condom']},
  {...home,title:'Activate the PrEP model',range:[13.8,21.2],pump:1,drug:1,what:'The seal retracts for comparison. Inside the cell viewer, a green marker slows an early HIV replication demonstration.',why:'PrEP means pre-exposure prophylaxis. Medicine taken before exposure interferes with steps HIV needs to establish infection.',tip:'The motor represents medicine already in use as prescribed. It does not show immediate protection after starting or a dose schedule.',source:['prep','mechanism']},
  {...home,title:'Compare both protections',range:[21.9,27],pump:1,shield:1,drug:1,what:'The machine seats the membrane again while the cell viewer continues its PrEP demonstration.',why:'The condom acts before fluid reaches the contact surface. PrEP acts biologically after exposure, when medication is already in use as prescribed.',tip:'Each method has a different job. Condoms can also reduce the chance of other sexually transmitted infections.',source:['condom','prep']},
  {...home,title:'Read the evidence',range:[27.7,32.7],pump:0,shield:1,drug:1,plate:1,what:'A brass evidence plate slides up to show the CDC estimate.',why:`CDC estimates ${efficacy.qualifier} ${efficacy.percent}% lower risk of ${efficacy.route} ${efficacy.condition}.`,tip:'This is a relative risk reduction observed across populations. It cannot tell an individual their chance of acquiring HIV from one exposure.',source:['prep']},
  {...home,title:'Reset the machine',range:[33.4,36],what:'The pump, membrane, cell indicator and evidence plate return to standby.',why:'Physical barriers reduce contact. Pre-exposure medicine makes it harder for HIV to establish infection.',tip:'Select the first switch to repeat the comparison.'}
];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const mix=(a,b,x)=>a+(b-a)*x;
const seconds=36;
function simulateSexualPrevention(t){
  t=clamp(Number.isFinite(t)?t:0,0,seconds);
  const index=lessons.findLastIndex(lesson=>t>=lesson.range[0]);
  const current=lessons[index]||home;
  const last=lessons[index-1]||home;
  const dt=index<0?0:t-current.range[0];
  const amount=(name,duration,delay=0)=>mix(last[name],current[name],smooth((dt-delay)/duration));
  const pump=amount('pump',index===5?1.5:1.7);
  const shield=amount('shield',index===1?5:index===2?2.3:2.2,index===1?.42:0);
  const drug=amount('drug',index===2?3.6:1.9,index===2?.48:0);
  const plate=amount('plate',index===4?2:1.8);
  const complete=t===seconds;
  const demo=complete?home:current;
  const contact=shield>=.955?'Barrier seated':shield>.04?'Barrier moving':pump>.05?'Potential exposure':'Pump parked';
  const cell=drug>=.95?'PrEP in use':drug>.05?'PrEP indicator moving':'PrEP not simulated';
  return {t,index,dt,complete,title:demo.title,what:demo.what,why:demo.why,tip:demo.tip,source:demo.source.map(key=>evidence[key]),
    pump,shield,drug,plate,contact,cell,copyVisibility:complete||index<0?0:index===5?1-smooth(dt/1.9):smooth((t-.9)/1.7),estimate:`≈${efficacy.percent}%`,
    qualifier:`${efficacy.measure} · ${efficacy.condition}`,motionPhase:Math.max(0,t-.9)*.8,
    takeaway:'Condoms reduce contact with fluids, and PrEP helps prevent HIV from taking hold if an exposure occurs.',
    next:index<0||complete?0:t>=current.range[1]?index+1:-1};
}
window.simulateSexualPrevention=simulateSexualPrevention;
</script>
<style>
:root{color-scheme:light;--paper:#f5f0e5;--ink:#233149;--shadow:#ddd4c3;--panel:#fcf7e9;--brass:#efc579;--sage:#b6c5a4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
main{max-width:1400px;margin:auto;padding:38px 26px 30px}
header{border-top:1.2px solid var(--ink);padding:15px 0 19px;border-bottom:1.2px solid var(--ink);margin-bottom:19px}
h1{font-size:clamp(2.25rem,5.4vw,4.65rem);line-height:.98;letter-spacing:-.05em;margin:0 0 12px}
header p{margin:0;font-size:1.1rem}
.layout{display:grid;grid-template-columns:180px minmax(0,1fr) 229px;gap:18px;align-items:start}
nav{position:relative}nav ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
button{font:700 .91rem/1.25 system-ui;text-align:left;background:#e9e2d3;color:var(--ink);border:1.2px solid var(--ink);border-radius:7px;padding:10px 9px;min-height:48px;width:100%;box-shadow:2px 2px 0 var(--shadow);cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button:disabled{color:#5b5c57;cursor:default}
button:not(:disabled),button.active{background:var(--brass)}
button.done{background:#dce3d2}
button span{display:inline-grid;place-items:center;min-width:22px;height:22px;border:1.2px solid var(--ink);border-radius:50%;margin-right:6px;font-size:.72rem}
#play{margin-top:16px;background:#e0e7d3}.render #play{visibility:hidden}
#cursor{position:absolute;top:0;left:0;width:39px;height:40px;z-index:1;pointer-events:none}
aside,figure{margin:0;border:1.2px solid var(--ink);border-radius:13px;background:var(--panel);box-shadow:4px 4px 0 var(--shadow)}
aside{padding:17px 15px 15px;min-height:330px}
aside h2{font-size:1.45rem;line-height:1.1;margin:3px 0 12px}
aside p{font:400 .91rem/1.42 system-ui;margin:0 0 11px}
aside a{display:block;margin:8px 0;font:600 .78rem system-ui;color:inherit}
#machine{display:block;width:100%;height:auto}
figcaption{font:500 .79rem/1.35 system-ui;padding:0 15px 15px}
#chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
#chips span{border:1.2px solid var(--ink);border-radius:20px;padding:4px 10px;background:var(--panel);font:600 .78rem system-ui}
#big{font-size:1.18rem;line-height:1.4;border-top:1.2px solid var(--ink);margin:0;padding-top:12px}
@media(max-width:1050px){.layout{grid-template-columns:156px minmax(0,1fr) 191px;gap:12px}}
@media(max-width:790px){.layout{grid-template-columns:148px minmax(0,1fr)}aside{grid-column:1/-1;min-height:0}}
@media(max-width:470px){main{padding:23px 14px}.layout{grid-template-columns:minmax(0,1fr)}figure{grid-row:1}aside{grid-column:auto}button{min-height:41px}nav ol{gap:7px}}
</style>
<main>
<header><h1>Sexual Transmission<br>Prevention Machine</h1><p>See where a condom acts and where PrEP acts.</p></header>
<div class="layout">
<nav aria-label="Lesson steps"><ol id="controls"></ol><button id="play" type="button">▶ Play 36 s tour</button><svg id="cursor" viewBox="0 0 42 43" aria-hidden="true"><path d="M9 22q3-5 8-1V7q0-6 6-5v17q4-4 7 0 4-3 6 2 5-2 5 4l-3 12-3 5H18l-1-6Z" fill="#efc579" stroke="#233149" stroke-width="1.2" stroke-linejoin="round"/><path d="M19 38h15m-7-14v5m7-4v5" stroke="#233149" stroke-width="1.2" stroke-linecap="round"/></svg></nav>
<figure><svg id="machine" viewBox="0 0 790 550" role="img" aria-label="Isometric prevention rig with a sample pump, transparent fluid channel, sliding membrane and separate cell viewer"></svg><figcaption>Cutaway teaching model. Coral symbols represent potential exposure. The cell viewer shows a separate example of early replication.</figcaption></figure>
<aside aria-label="Medical notes"><h2 id="title"></h2><p><b>Action.</b> <span id="what"></span></p><p><b>Mechanism.</b> <span id="why"></span></p><p id="tip"></p><div id="sources"></div></aside>
</div>
<div id="chips" aria-label="Machine readings"><span></span><span></span><span></span></div>
<p id="big"><b>The big idea:</b> <span></span></p>
</main>
<script>
const ink='#233149',shadow='#ddd4c3';
const brass=['#f5d99d','#e2b76c','#ad794e'];
const metal=['#f4f0df','#d6d8cb','#a0aba2'];
const green=['#d5e0bf','#aabe9a','#7d937c'];
const blue=['#eff5e7','#d7e7de','#9bb9b2'];
const shell=['#f6e6b4','#e9c581','#bd8d58'];
const coral=['#f4ba9e','#dc8974','#aa6258'];
const n=x=>Number(x.toFixed(2));
const stroke=`stroke="${ink}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"`;
const polygon=(p,fill)=>`<polygon points="${p}" fill="${fill}" ${stroke}/>`;
const rect=(x,y,w,h,fill,r=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${stroke}/>`;
const line=(d,fill='none')=>`<path d="${d}" fill="${fill}" ${stroke}/>`;
const circle=(x,y,r,fill)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${stroke}/>`;
const ellipse=(x,y,rx,ry,fill)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" ${stroke}/>`;
const label=(x,y,s,size=12,anchor='start')=>`<text x="${x}" y="${y}" font-family="system-ui" font-size="${size}" font-weight="700" fill="${ink}" text-anchor="${anchor}">${s}</text>`;
function box(x,y,w,h,d,c){
  const q=n(d*.52);
  return polygon(`${x},${y} ${x+d},${y-q} ${x+w+d},${y-q} ${x+w},${y}`,c[0])+
  polygon(`${x+w},${y} ${x+w+d},${y-q} ${x+w+d},${y+h-q} ${x+w},${y+h}`,c[2])+rect(x,y,w,h,c[1]);
}
function cylinder(x,y,r,h,c){
  const e=n(r*.35);
  return line(`M${x-r} ${y}v${h}a${r} ${e} 0 0 0 ${2*r} 0v-${h}z`,c[1])+ellipse(x,y,r,e,c[0])+line(`M${x+r-6} ${y+4}v${h-4}`);
}
const bolt=(x,y)=>circle(x,y,3,metal[0])+line(`M${x-1.5} ${y+1}l3 -2`);
const bolts=(x,y,w,h)=>[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].map(p=>bolt(...p)).join('');
function gear(cx,cy,r,angle,c=brass){
 const points=Array.from({length:48},(_,i)=>{const a=i/48*Math.PI*2;const rad=i%4<2?r:r*.86;return `${n(cx+Math.cos(a)*rad)},${n(cy+Math.sin(a)*rad)}`;}).join(' ');
 return `<g transform="rotate(${n(angle)} ${cx} ${cy})">${polygon(points,c[1])}${circle(cx,cy,r*.56,c[0])}${circle(cx,cy,r*.22,c[2])}${line(`M${cx} ${cy-r*.7}v${r*.4}`)}</g>`;
}
const pipe=d=>`<path d="${d}" fill="none" stroke="${ink}" stroke-width="16.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${blue[2]}" stroke-width="14" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${blue[1]}" stroke-width="7" stroke-linecap="round"/>`;
const virion=(x,y,r,opacity)=>`<g transform="translate(${n(x)} ${n(y)}) scale(${r/6})" opacity="${n(opacity)}">${circle(0,0,4.7,coral[1])}${[0,60,120,180,240,300].map(a=>`<g transform="rotate(${a})">${line('M0 -5v-2')}${circle(0,-7,.7,coral[0])}</g>`).join('')}${line('M-2 1q2-3 4 0')}</g>`;
const title=(x,y,w,s,c=brass)=>box(x,y,w,24,7,c)+label(x+w/2,y+16,s,11,'middle');
const fixed = [
 `<path d="M42 483 694 483 762 444 781 454 712 500 70 500Z" fill="${shadow}"/>`,
 box(75,464,58,25,22,metal),box(613,464,57,25,22,metal),box(673,426,36,24,16,metal),
 box(55,431,631,40,66,metal),box(69,147,596,284,63,shell),
 box(85,129,559,23,60,metal),
 box(100,166,544,234,16,metal),rect(109,176,525,211,blue[1],12),rect(117,184,509,195,blue[0],8),
 line('M124 207l18-13m-17 25 22-17M601 353l19-14m-21 25 19-14'),
 bolts(108,173,529,212),bolts(74,439,591,22),
 title(99,134,158,'SAMPLE PUMP'),title(296,134,148,'CONDOM SLIDER'),
 title(511,134,134,'CELL VIEWER'),
 box(124,227,87,124,14,metal),cylinder(162,209,29,86,blue),cylinder(162,205,34,12,brass),
 box(125,310,74,22,11,metal),bolt(135,321),bolt(189,321),
 pipe('M195 271H242Q252 271 252 284V305H477'),rect(220,262,9,18,metal[1],2),
 box(266,276,199,56,10,metal),rect(275,284,180,39,blue[1],9),line('M282 292H444'),
 box(479,278,34,55,8,coral),line('M487 285q9 11 17 0m-17 12q9 11 17 0m-17 12q9 11 17 0m-17 12q9 11 17 0'),
 rect(334,206,14,117,metal[0],4),rect(371,206,14,117,metal[0],4),
 box(523,208,89,146,13,metal),rect(529,216,77,128,blue[1],8),
 ellipse(568,282,31,34,blue[0]),ellipse(568,282,24,27,'#fcf7e9'),
 box(95,400,220,25,13,brass),box(328,400,311,25,13,green),
 label(105,417,'FLUID CHANNEL',10),label(343,417,'CELL MODEL',10),
 label(496,347,'MUCOSA',9,'middle'),label(568,232,'EARLY COPYING',9,'middle'),
 ...Array.from({length:11},(_,i)=>line(`M${572+i*7} 448l5-5m-5 11 5-5`)),
 ...Array.from({length:6},(_,i)=>line(`M697 ${208+i*9}l23-12`)),
 box(595,93,48,33,12,brass),cylinder(621,80,23,19,metal),
 box(198,95,88,33,13,metal),cylinder(224,84,19,17,brass),cylinder(259,85,13,14,green),
 box(305,96,112,32,16,brass),line('M321 100l-7 12h24l-7 10m14-17h17m8 0h17'),
 title(101,449,175,'PREVENTION TEST RIG',metal)
].join('');
function draw(m){
  const y=n(186+86*m.shield);
  const resetAngle=(lessons.at(-1).range[0]-.9)*.8*38;
  const revolutions=m.index<0?0:m.index===5?mix(resetAngle,Math.round(resetAngle/360)*360,smooth(m.dt/2.25)):m.motionPhase*38;
  const fluid=Array.from({length:8},(_,i)=>{
    const raw=(m.motionPhase*.72+i/8)%1;
    const p=raw<0?raw+1:raw;
    const x=282+201*p;
    const entry=smooth(p/.14)*(1-smooth((p-.9)/.10));
    const beyondShield=1-m.shield*smooth((x-344)/9);
    return virion(x,305,4.5,m.pump*entry*beyondShield);
  }).join('');
  const angle=n(revolutions);
  const offset=n(44*(1-m.drug));
  const copies=Array.from({length:3},(_,i)=>{
    const x=551+i*16;
    const alpha=(1-.82*m.drug)*(.51+.42*Math.sin(m.motionPhase*3+i*1.5));
    return virion(x,293,4,alpha);
  }).join('');
  const plateY=n(369-18*m.plate);
  return fixed+[
   `<g opacity="${n(m.pump)}">${ellipse(162,255,20,8,coral[0])}${virion(154,244,5.2,.85)}${virion(173,265,4.5,.85)}</g>`,
   gear(158,339,14,revolutions),gear(189,342,11,-revolutions,metal),
   fluid,
   rect(350,163,18,y-156,metal[1],3),line(`M356 167V${y+3}`),
   box(342,y,31,41,9,green),line(`M350 ${y+7}v27m6-27v27m6-27v27`),
   `<g transform="rotate(${n(-52+49*m.shield)} 380 104)">${line('M380 104h49')}${circle(429,104,8,brass[1])}</g>`,circle(380,104,6,brass[0]),
   gear(620,96,15,angle,metal),
   `<g opacity="${n(m.copyVisibility)}">${virion(567,267,4.7,.83)}${copies}</g>`,
   `<g opacity="${n(smooth(m.drug/.17))}">${line(`M568 ${n(273-offset)}V${n(280-offset)}`)}${rect(557,n(275-offset),22,7,green[1],3)}${line(`M563 ${n(278-offset)}l3 2 6-3`)}</g>`,
   label(568,329,'MEDICINE ACTS HERE',7.5,'middle'),
   circle(202,411,3.3,m.pump>.05?coral[1]:metal[1]),label(212,415,m.contact,10),
   circle(433,411,3.3,m.drug>.05?green[2]:metal[1]),label(443,415,m.cell,10),
   `<g opacity="${n(m.plate)}">${box(237,plateY,220,34,12,brass)}${label(255,plateY+23,m.estimate,19)}${label(320,plateY+15,'LOWER RISK FROM SEX',10)}${label(320,plateY+26,'CDC · PrEP AS PRESCRIBED',8)}</g>`
  ].join('');
}
const get=id=>document.getElementById(id);
const machine=get('machine'),cursor=get('cursor'),controls=get('controls'),play=get('play');
const renderMode=new URLSearchParams(location.search).has('render');
document.body.classList.toggle('render',renderMode);
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const buttons=lessons.map((lesson,index)=>{
  const li=document.createElement('li');
  const btn=document.createElement('button');
  btn.type='button';
  btn.innerHTML=`<span aria-hidden="true">${index+1}</span>${lesson.title}`;
  li.append(btn);controls.append(li);
  return btn;
});
let playing=false, manualBusy=false, run=0, tourTime=0;
const setText=(node,value)=>{if(node.textContent!==value)node.textContent=value;};
let previousDrawing;
function show(m,kind){
  const drawing=draw(m);
  if(drawing!==previousDrawing){machine.innerHTML=drawing;previousDrawing=drawing;}
  setText(get('title'),m.title);setText(get('what'),m.what);setText(get('why'),m.why);setText(get('tip'),m.tip);
  setText(get('big').lastElementChild,m.takeaway);
  const refs=m.source.map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener">${name} ↗</a>`).join('');
  if(get('sources').innerHTML!==refs)get('sources').innerHTML=refs;
  [m.contact,m.cell,m.plate>.1?`${m.estimate} · ${m.qualifier}`:'Sexual exposure demonstration'].forEach((s,i)=>setText(get('chips').children[i],s));
  buttons.forEach((btn,i)=>{
    const active=!m.complete&&i===m.index&&m.next<0;
    btn.className=active?'active':!m.complete&&i<m.index?'done':'';
    btn.disabled=kind!=='manual'||manualBusy||i!==m.next;
    if(active)btn.setAttribute('aria-current','step');else btn.removeAttribute('aria-current');
  });
  if(kind==='guided'&&!m.complete){
    const i=Math.max(0,m.index);
    const [start,end]=lessons[i].range;
    const target=i+1<buttons.length&&m.t>=end?i+1:i;
    const travel=target===i?(m.index<0?smooth(m.t/.9):1):smooth((m.t-end)/.7);
    const a=buttons[i], b=buttons[target];
    const y=mix(a.offsetTop+a.offsetHeight*.45,b.offsetTop+b.offsetHeight*.45,travel)-12;
    const press=m.index<0?smooth((m.t-.76)/.14):target!==i?smooth((m.t-end-.53)/.17):1-smooth((m.t-start)/.24);
    const edge=innerWidth<=470?a.offsetWidth-37:a.offsetWidth+5;
    cursor.style.transform=`translate(${n(edge-16*press)}px,${n(y)}px) rotate(${n(-24-6*press)}deg)`;
    cursor.style.opacity=String(m.index<0?smooth(m.t/.35):1-smooth((m.t-35.6)/.4));
  } else {
    cursor.style.opacity='0';
    cursor.style.transform='translate(0px,0px)';
  }
  return m;
}
function seek(t){
  if(!renderMode){run++;playing=false;manualBusy=false;setText(play,'▶ Play 36 s tour');}
  return show(simulateSexualPrevention(t),'guided');
}
window.seek=seek;
if(renderMode){seek(0);}else{
  show(simulateSexualPrevention(0),'manual');
  buttons.forEach((button,i)=>button.addEventListener('click',()=>{
    if(button.disabled)return;
    const token=++run;
    playing=false;tourTime=0;setText(play,'▶ Play 36 s tour');
    const [start,end]=lessons[i].range;
    const duration=reduce.matches?0:(end-start)*1000;
    manualBusy=true;
    const began=performance.now();
    const tick=now=>{
      if(token!==run)return;
      const p=duration?clamp((now-began)/duration):1;
      if(p>=1)manualBusy=false;
      show(simulateSexualPrevention(mix(start,end,p)),'manual');
      if(p<1)requestAnimationFrame(tick);
    };
    if(!duration)tick(began);else{show(simulateSexualPrevention(start),'manual');requestAnimationFrame(tick);}
  }));
  play.addEventListener('click',()=>{
    const token=++run;
    if(playing){playing=false;setText(play,'▶ Resume tour');return;}
    playing=true;manualBusy=false;setText(play,'Ⅱ Pause tour');
    if(tourTime===36)tourTime=0;
    const origin=performance.now()-tourTime*1000;
    const tick=now=>{
      if(token!==run)return;
      tourTime=clamp((now-origin)/1000,0,36);
      if(tourTime===36){playing=false;setText(play,'▶ Play 36 s tour');show(simulateSexualPrevention(36),'manual');}
      else{
        show(simulateSexualPrevention(tourTime),'guided');
        requestAnimationFrame(tick);
      }
    };
    requestAnimationFrame(tick);
  });
}
</script>
</html>
