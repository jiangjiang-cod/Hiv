<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 · Transmission Pathway Machine</title>
<script>
'use strict';
const CDC = 'https://www.cdc.gov/hiv/causes/index.html';
const WHO = 'https://www.who.int/news-room/fact-sheets/detail/hiv-aids';
const ENTRY = Object.freeze(['Mucous membrane','Damaged tissue','Direct to bloodstream']);
const SCENES = Object.freeze([
  {title:'Start with a route',tag:'STANDBY',description:'Choose the first switch to follow a simulated fluid through one of the entry channels.',why:'Certain body fluids must reach a suitable entry site. The machine shows three categories described by the CDC.',fluid:'None loaded',entry:'None selected',key:'idle'},
  {title:'Mucous membrane',tag:'CHANNEL A',description:'The top valve opens. The fluid reaches a model of a mucous membrane.',why:'For example, semen that contains HIV can contact the lining of the vagina or rectum during sex. The symbols show possible exposure.',fluid:'Semen containing HIV',entry:ENTRY[0],key:'membrane',sourceStatus:'transmissible'},
  {title:'Damaged tissue',tag:'CHANNEL B',description:'The middle valve opens toward the gap in the model surface.',why:'Blood that contains HIV can reach damaged tissue. A gap in the surface shows how this differs from contact with intact skin.',fluid:'Blood containing HIV',entry:ENTRY[1],key:'tissue',sourceStatus:'transmissible'},
  {title:'Direct to bloodstream',tag:'CHANNEL C',description:'The lower valve opens straight into the model bloodstream inlet.',why:'Shared injection equipment can carry blood that contains HIV into another person’s bloodstream. Sterile equipment helps prevent this route.',fluid:'Blood containing HIV',entry:ENTRY[2],key:'blood',sourceStatus:'transmissible'},
  {title:'Intact skin',tag:'BARRIER TEST',description:'The same blood example reaches a solid model of intact skin. The symbols stay on the outside.',why:'Intact skin provides a barrier. In this example the blood touches only unbroken skin.',fluid:'Blood containing HIV',entry:'Intact skin only',key:'skin',sourceStatus:'transmissible'},
  {title:'Everyday contact',tag:'SOCIAL CONTACT',description:'The greeting plate slides in. All three valves stay closed.',why:'Ordinary handshakes, hugs and sharing food do not spread HIV.',fluid:'No infectious fluid exchanged',entry:'Ordinary social contact',key:'social'},
  {title:'Reset',tag:'RETURN TO START',description:'The channel selector and greeting plate return to their starting positions.',why:'To check an exposure, ask which fluid was involved and whether it reached a suitable entry site.',fluid:'None loaded',entry:'None selected',key:'reset'}
].map(Object.freeze));
const STEPS = Object.freeze([ [0.9,6.3],[7,12.5],[13.2,18.7],[19.4,25],[25.7,31.9],[32.6,36] ].map(Object.freeze));
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const smooth = v => {v=clamp(v); return v*v*(3-2*v);};
const mix = (a,b,v) => a+(b-a)*v;
const CONCLUSION = 'HIV needs a suitable fluid and a way into the body. Everyday social contact is safe.';
function simulateHIVTransmission(state) {
  const {index=0,progress=1,sourceStatus,entry,fluid,recording=false}=state;
  const scene=SCENES[index] || SCENES[0];
  const route=entry ?? scene.entry;
  const fluidType=fluid ?? scene.fluid;
  const source=sourceStatus ?? scene.sourceStatus;
  const channel=ENTRY.indexOf(route);
  const open=smooth((progress-.07)/.32);
  const suitable=fluidType==='Blood containing HIV'||fluidType==='Semen containing HIV';
  const possible=suitable && channel>=0 && source==='transmissible';
  const unknownSource=source==null || source==='unknown';
  const uncertain=channel>=0 && ((suitable&&unknownSource)||(fluidType==='Unknown'&&source!=='no-hiv'));
  const skin=route==='Intact skin only';
  const social=route==='Ordinary social contact';
  const reached=open>=.94;
  const release=recording?1-smooth((progress-.84)/.16):1;
  const flow=possible || (skin&&suitable&&source==='transmissible');
  const risk=uncertain?'Needs assessment':possible?'Possible exposure':(skin||social||(channel>=0&&!uncertain))?'No pathway here':'Ready';
  const status=scene.key==='reset'?'Returning to start':(possible||skin||social)&&!reached?'Setting the selector':risk;
  return Object.freeze({title:scene.title,tag:scene.tag,medicalExplanation:scene.why,description:scene.description,
    transmissionPossible:uncertain?null:possible,barrierStatus:skin?'Intact':channel>=0?'Entry site selected':'No exposure',
    evidenceSource:social?WHO:CDC,conclusion:CONCLUSION,
    displayValues:{count:ENTRY.length,countUnit:'entry categories',fluid:fluidType,entry:route,status,risk},
    motion:{channel,skin,social,open,release,showParticles:flow,key:scene.key}});
}
function modelAtTime(t) {
  const time=clamp(Number.isFinite(+t)?+t:0,0,36);
  const k=STEPS.findLastIndex(([start])=>time>=start);
  const index=k+1;
  const [start,end]=STEPS[k] || [0,.9];
  const progress=clamp((time-start)/(end-start));
  const next=index===0?1:index<6 && time>=end?index+1:0;
  const landing=STEPS[k+1]?.[0];
  const cursor=landing==null?index:mix(index||.35,index+1,smooth((time-(index?end:0))/(landing-(index?end:0))));
  return {time,index,progress,next,cursor,finished:time>=36,closing:index===6&&progress>=.7,
    model:simulateHIVTransmission({index:index===6&&time>=35.45?0:index,progress,recording:true})};
}
window.simulateHIVTransmission=simulateHIVTransmission;
window.modelAtTime=modelAtTime;
</script>

d;stroke-linejoin:round}.panelText{font:700 12px ui-monospace,Menlo,monospace;fill:var(--ink)}.mini{font:700 9px ui-monospace,Menlo,monospace;fill:var(--ink)}.gaugeText{font:700 10px ui-monospace,Menlo,monospace;fill:var(--ink)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:600px){main{padding:16px 10px}.grid{grid-template-columns:104px minmax(0,1fr);gap:9px}nav button{font-size:11px;height:56px;grid-template-columns:14px 1fr;gap:4px;padding:4px}nav button small{height:14px;width:14px;font-size:8px}.plate{display:none}.big{font-size:16px}.chip{font-size:9px;padding:4px}.right{padding:10px}.right h2{font-size:21px}.right p{font-size:12px}header{margin-bottom:17px}header p:last-child{font-size:15px}.hand{width:34px;left:calc(100% - 12px)}}

<body><main>

<div class="chips" id="chips"></div><div class="swatches"><span class="label">Casing</span><button aria-label="Ochre casing" data-palette="0" style="background:#deaa70" aria-pressed="true"></button><button aria-label="Sage casing" data-palette="1" style="background:#9fb79c" aria-pressed="false"></button><button aria-label="Blue casing" data-palette="2" style="background:#a1bac0" aria-pressed="false"></button></div>

<script>
const $=id=>document.getElementById(id);
const ink='#1f2e3d',shadow='#ddd4c3',brass=['#fae4ab','#e0ad61','#b27d3e'],chrome=['#f6f5eb','#d8ddda','#9fa8a7'],coral=['#f6c2a9','#e28a73','#b75f50'],sage=['#dce8c8','#a7bd91','#728d6c'];
const palettes=[['#f6d7a8','#deaa70','#ae794a'],['#d5e4cb','#9fb79c','#748a70'],['#dae6e3','#a1bac0','#748f98']];
const rect=(x,y,w,h,fill,r=0,other='')=>`<rect class="ink" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${other}/>`;
const path=(d,fill='none',other='')=>`<path class="ink" d="${d}" fill="${fill}" ${other}/>`;
const circle=(x,y,r,fill,other='')=>`<circle class="ink" cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${other}/>`;
const type=(x,y,s,cl='mini',other='')=>`<text x="${x}" y="${y}" class="${cl}" ${other}>${s}</text>`;
const group=(id,inside)=>`<g id="${id}">${inside}</g>`;
function block(x,y,w,h,d,colors,r=2) {
  const [light,front,dark]=colors, rise=d*.56;
  return path(`M${x} ${y}l${d} ${-rise}h${w}l${-d} ${rise}Z`,light)+path(`M${x+w} ${y}l${d} ${-rise}v${h}l${-d} ${rise}Z`,dark)+rect(x,y,w,h,front,r);
}
function screw(x,y){return circle(x,y,3.5,chrome[0])+path(`M${x-1.6} ${y+1.5}l3-3`);}
function screws(points){return points.map(p=>screw(...p)).join('');}
function tube(d){
  return path(d,'none','style="stroke-width:16"')+path(d,'none','style="stroke:#91a9a6;stroke-width:13.6"')+
    path(d,'none','style="stroke:#deeeea;stroke-width:10.6"')+path(d,'none','style="stroke:#faf8e9;stroke-width:2.4" transform="translate(0,-2)"');
}
function virus(size=1){
  return `<g transform="scale(${size})">`+circle(0,0,6.9,coral[1])+path('M-2.8 -3.1 3 -2.3 1.2 3.5Z',coral[0])+
    Array.from({length:8},(_,i)=>{const a=Math.PI*i/4;return path(`M${Math.cos(a)*7} ${Math.sin(a)*7}L${Math.cos(a)*9.5} ${Math.sin(a)*9.5}`)+circle(Math.cos(a)*9.5,Math.sin(a)*9.5,.8,coral[0]);}).join('')+'</g>';
}
const ys=[219,286,353];
const routePath = y => `M249 286 H276 Q297 286 297 265 V${y===219?240:265} Q297 ${y} 318 ${y} H613`;
const lines=[routePath(219),'M249 286 H613','M249 286 H276 Q297 286 297 307 V332 Q297 353 318 353 H613'];
function valve(x,y,i){
  const spokes=Array.from({length:6},(_,j)=>{const a=j*Math.PI/3;return path(`M0 0L${14*Math.cos(a)} ${14*Math.sin(a)}`);}).join('');
  return block(x-22,y-18,44,35,9,brass,4)+`<g transform="translate(${x},${y})">`+
    group('wheel'+i,circle(0,0,15,brass[0])+spokes+circle(0,0,6,brass[1])+path('M-8 -8 L8 8 M8 -8 L-8 8'))+'</g>';
}
function site(x,y,i){
  const shapes=[path(`M${x+12} ${y-14}q14 -9 27 0t27 0v25q-14 9-27 0t-27 0Z`,'#e2b4a0')+path(`M${x+12} ${y-8}q14 -9 27 0t27 0`),
    path(`M${x+11} ${y-12}h22l7 13 8-13h19v23h-56Z`,'#eed2ad')+path(`M${x+11} ${y+4}h56`),
    path(`M${x+11} ${y-9}h58v17h-58Z`,'#dba998')+path(`M${x+11} ${y}h58`)];
  return block(x,y-20,79,39,11,chrome,4)+shapes[i]+type(x+40,y+32,['MUCOSA','DAMAGED TISSUE','BLOODSTREAM'][i],'mini','text-anchor="middle"');
}
function gauge(){
  const cx=682,cy=130;
  return block(633,88,99,83,20,chrome,5)+circle(cx,cy,31,'#fff7df')+
    [-60,-30,0,30,60].map(a=>`<g transform="rotate(${a} ${cx} ${cy})">${path(`M${cx} ${cy-27}v5`)}</g>`).join('')+
    group('needle',path(`M${cx-2} ${cy+3}l2-24 3 24Z`,coral[1]))+circle(cx,cy,3.3,brass[1])+type(cx,153,'SELECTOR','mini','text-anchor="middle"');
}
function machineArt(palette){
  const caseColors=palettes[palette], box=(...args)=>block(...args,caseColors,4);
  const chamber=path('M214 180 648 180 713 146 281 146Z','#e0e8df')+
    path('M648 180 713 146 713 384 648 417Z','#b6cac2')+
    rect(214,180,490,237,'#edf0df',6)+path('M222 188 H696 M222 409 H696','none','style="stroke:#a1a797"')+
    path('M223 192l43 0m396 207h29','none','style="stroke:#fffdf0;stroke-width:2.5"');
  let result=`<path d="M40 485l558 0 163-91 21 16-151 114H56Z" fill="${shadow}"/>`+
    block(64,461,63,24,22,chrome,4)+block(630,456,61,24,24,chrome,4)+block(164,417,55,22,21,chrome,4)+
    box(54,438,650,33,80)+box(92,155,599,276,66)+
    block(132,128,538,41,57,chrome,4)+block(166,99,342,54,49,brass,6)+
    rect(179,107,312,34,'#fff4d7',4)+screws([[186,114],[483,133]])+
    type(335,130,'EXPOSURE SELECTOR','panelText','text-anchor="middle"')+
    path('M170 100l44-24h249l-42 24','none')+
    block(518,102,98,48,24,brass,5)+rect(525,109,84,34,'#f9f4e3',3)+
    type(535,123,'ENTRY TYPES')+type(590,137,simulateHIVTransmission({}).displayValues.count,'panelText','text-anchor="end"')+chamber+gauge()+
    box(80,188,119,226,33)+rect(96,200,87,190,'#f7edcf',5)+
    block(106,215,67,111,13,chrome,6)+rect(114,228,48,86,'#e0eee7',5)+
    rect(119,235,38,68,'#e9f1e7',5)+group('sample',rect(119,269,38,34,'#e9b39d',3)+`<g transform="translate(137 286)">${virus(.75)}</g>`)+
    block(109,212,58,12,12,brass,4)+block(108,306,61,10,11,brass,4)+
    type(139,344,'SAMPLE','mini','text-anchor="middle"')+type(139,359,'HIV SYMBOL','mini','text-anchor="middle"')+
    screws([[102,206],[177,382],[98,383],[177,206]])+
    tube('M168 285H249')+
    lines.map((d,i)=>tube(d)+path(d,'none',`id="track${i}" visibility="hidden"`)).join('')+
    lines.map((d,i)=>path(d,'none',`id="highlight${i}" style="stroke:#e7a38a;stroke-width:8;opacity:0"`)).join('')+
    ys.map((y,i)=>site(611,y,i)).join('')+
    ys.map((y,i)=>path(`M368 ${y-3}v-9`)+valve(368,y-25,i)+type(335,y-20,['A','B','C'][i],'panelText','text-anchor="middle"')).join('')+
    group('dots',Array.from({length:8},(_,i)=>group('dot'+i,virus(.58))).join(''))+
    group('skinGate',block(551,266,22,40,11,sage,4)+path('M556 271v30m5-30v30m5-30v30')+rect(469,233,118,20,'#e5ecd5',5)+type(528,247,'INTACT SKIN','mini','text-anchor="middle"'))+
    group('greeting',block(428,376,150,29,9,sage,5)+rect(434,380,138,20,'#eff1d7',4)+
    path('M439 388l5-5 7 3 5-2 7 5-7 7-6-2-5 1Z',brass[0])+path('M445 384l5 6m5-5-5 6m3 2 2-3')+type(517,394,'HANDSHAKE','mini','text-anchor="middle"'))+
    block(208,419,489,22,16,chrome,4)+screws([[218,427],[689,427],[220,185],[694,185],[219,407],[694,407]])+
    block(80,424,115,23,9,brass,3)+type(138,439,'TRAINING RIG','mini','text-anchor="middle"')+
    block(217,448,364,46,13,chrome,5)+rect(226,456,347,30,'#f9efcc',3)+
    circle(241,471,4.5,brass[1],'id="lamp"')+type(258,475,'READY','panelText','id="screen"')+
    block(593,448,101,43,11,brass,5)+
    Array.from({length:5},(_,i)=>path(`M${604+i*17} 462l5 -5m-5 11 5 -5m-5 11 5 -5`)).join('');
  $('machine').innerHTML=result;
}
let palette=0,manualIndex=0,busy=false,manual=null,tour=null,frame=0,current;
const renderMode=new URLSearchParams(location.search).has('render');
document.body.classList.toggle('render',renderMode);
const steps=$('steps');
steps.innerHTML=SCENES.slice(1).map((scene,i)=>`<li><button type="button" data-index="${i+1}"><small>${String(i+1).padStart(2,'0')}</small><span>${scene.title}</span></button></li>`).join('');
const buttons=Array.from(steps.querySelectorAll('button'));
const update=(node,text)=>{if(node.textContent!==text) node.textContent=text;};
function display(state, guided=false) {
  current=state;
  const {model:m,index,progress,cursor,closing,finished}=state;
  const {motion,displayValues:v}=m;
  const open=motion.open;
  const prevSelector=[-60,-60,-55,-15,25,60,55][index];
  const selector=motion.channel>=0?[-55,-15,25][motion.channel]:motion.skin?60:motion.social?55:-60;
  const arm=index===6?mix(55,-60,smooth(progress/.6)):mix(prevSelector,selector,smooth(progress/.35));
  $('needle').setAttribute('transform',`rotate(${arm} 682 130)`);
  $('sample').setAttribute('opacity',motion.showParticles?smooth(progress/.22)*motion.release:0);
  const gate=motion.skin?open*motion.release:0;
  $('skinGate').setAttribute('transform',`translate(0,${mix(-28,0,gate)})`);
  $('skinGate').setAttribute('opacity',gate);
  const greeting=motion.social?open:index===6?1-smooth(progress/.55):0;
  $('greeting').setAttribute('transform',`translate(${mix(-48,0,greeting)},0)`);
  $('greeting').setAttribute('opacity',greeting);
  const visibleChannel=motion.skin?1:motion.channel;
  for(let i=0;i<3;i++){
    $('wheel'+i).setAttribute('transform',`rotate(${i===motion.channel?open*72*motion.release:0})`);
    $('highlight'+i).style.opacity=i===visibleChannel&&motion.showParticles?String(.65*open*motion.release):'0';
  }
  if(motion.skin){
    $('highlight1').setAttribute('d','M249 286 H550');
  }else{
    $('highlight1').setAttribute('d',lines[1]);
  }
  const track=$('track'+Math.max(visibleChannel,0));
  const full=track.getTotalLength();
  for(let i=0;i<8;i++){
    const dot=$('dot'+i);
    if(!motion.showParticles){dot.setAttribute('opacity',0);continue;}
    const phase=progress*2.6-i*.126;
    const local=phase-Math.floor(phase);
    const reach=motion.skin?301:full;
    const point=track.getPointAtLength(reach*local);
    const opacity=phase<0?0:smooth((open-.78)/.22)*smooth(local/.12)*smooth((1-local)/.15)*motion.release;
    dot.setAttribute('transform',`translate(${point.x} ${point.y})`);
    dot.setAttribute('opacity',opacity);
  }
  $('lamp').setAttribute('fill',v.status==='Possible exposure'?coral[1]:v.status==='No pathway here'?sage[1]:brass[1]);
  update($('screen'),v.status.toUpperCase());
  update($('tag'),m.tag); update($('title'),m.title); update($('desc'),m.description); update($('why'),m.medicalExplanation);
  update($('fluid'),v.fluid);update($('entry'),v.entry);update($('status'),v.status);
  $('evidence').href=m.evidenceSource;
  update($('evidence'),m.evidenceSource===WHO?'WHO · HIV and AIDS ↗':'CDC · How HIV Spreads ↗');
  $('chips').innerHTML=`<span class="chip">${v.count} ${v.countUnit}</span><span class="chip" data-risk="${v.status==='Possible exposure'?'possible':v.status==='No pathway here'?'none':'ready'}">${v.status}</span><span class="chip">${v.entry}</span>`;
  update($('big').lastElementChild,m.conclusion);
  $('big').classList.toggle('closing',!!closing);
  document.body.classList.toggle('tour',guided&&!finished);
  const active=index===6&&finished?0:index;
  buttons.forEach((b,i)=>{
    const n=i+1;
    b.disabled=renderMode||guided||busy||n!==manualIndex+1;
    b.dataset.active=String(n===active);
    b.dataset.next=String(n===(guided?state.next:manualIndex+1)&&(!busy||guided));
    b.dataset.pressed=String(guided&&n===active&&state.time-STEPS[index-1]?.[0]<.15);
  });
  if(guided&&!finished){
    const start=buttons[0].offsetTop,end=buttons.at(-1).offsetTop;
    const y=start+(cursor-1)*(end-start)/5+12;
    const walk=4*Math.sin(Math.PI*cursor);
    $('hand').style.transform=`translate(${walk}px,${y}px) rotate(${walk*.4}deg)`;
  }
  document.documentElement.dataset.step=String(index);
  document.documentElement.dataset.status=v.status;
}
function seek(t){
  if(frame)cancelAnimationFrame(frame);
  frame=0;tour=null;manual=null;busy=false;
  const state=modelAtTime(t);
  manualIndex=state.finished?0:Math.min(state.index,5);
  display(state,true);
  return state;
}
window.seek=seek;
machineArt(palette);
function initial(){manualIndex=0;busy=false;display({index:0,progress:1,model:simulateHIVTransmission({index:0})});}
function operate(index){
  const p=$('reduce').checked?1:0;
  busy=true;manual={index,begin:performance.now(),duration:index===4?2600:1700};
  if(p){finishManual(index);return;}
  animateManual(manual.begin);
}
function finishManual(index){
  manual=null;frame=0;busy=false;
  if(index===6){initial();return;}
  manualIndex=index;
  display({index,progress:1,model:simulateHIVTransmission({index,progress:1})});
  update($('announcement'),SCENES[index].title+': '+current.model.displayValues.status);
}
function animateManual(now){
  if(!manual)return;
  const {index,begin,duration}=manual;
  const progress=clamp((now-begin)/duration);
  if(progress>=1){finishManual(index);return;}
  display({index,progress,model:simulateHIVTransmission({index,progress})});
  frame=requestAnimationFrame(animateManual);
}
function animateTour(now){
  if(!tour)return;
  const time=tour.offset+(now-tour.start)/1000;
  if(time>=36){tour=null;frame=0;$('pause').disabled=true;manualIndex=0;display({...modelAtTime(36),index:0},false);return;}
  display(modelAtTime(time),true);
  frame=requestAnimationFrame(animateTour);
}
if(renderMode){
  seek(0);
}else{
  initial();
  $('reduce').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
  buttons.forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)operate(+b.dataset.index);}));
  $('tour').onclick=()=>{if(frame)cancelAnimationFrame(frame);busy=false;manual=null;manualIndex=0;tour={start:performance.now(),offset:0};$('pause').textContent='Pause';$('pause').disabled=false;animateTour(tour.start);};
  $('pause').onclick=()=>{
    if(!tour)return;
    if(tour.paused){tour.start=performance.now();tour.paused=false;$('pause').textContent='Pause';animateTour(tour.start);}
    else{cancelAnimationFrame(frame);tour.offset=current.time;tour.paused=true;$('pause').textContent='Resume';}
  };
  document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{
    palette=+b.dataset.palette;
    document.querySelectorAll('[data-palette]').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));
    machineArt(palette);display(current,!!tour);
  });
}
</script>
